name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: fmt + clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Native TLS headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Formatting
        run: cargo fmt --all -- --check

      # Run on both platforms: a helper used only under `cfg(windows)` is dead code
      # on Linux, and one used only under `cfg(unix)` is dead code on Windows.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Native TLS headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      # Includes the ASCII-only source check, which enforces the "no localized
      # strings in the engine" constraint.
      - name: Tests
        run: cargo test --workspace

  ascii:
    name: source is ascii
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Reject non-ascii bytes in sources
        run: |
          if grep -rIlP '[^\x00-\x7F]' crates --include='*.rs'; then
            echo "::error::non-ascii source files found (see the files above)"
            exit 1
          fi

  # A green lint and test run says the code compiles; this says the binary does,
  # on every platform we publish for, and leaves it downloadable from the run.
  build:
    name: build (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Native TLS headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        run: cargo build --release --locked

      - name: Stage
        shell: bash
        run: |
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/mlrc.exe dist/
          else
            cp target/release/mlrc dist/
          fi
          cp LICENSE README.md dist/

      - name: Smoke test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/mlrc.exe --version
          else
            ./dist/mlrc --version
          fi

      # Kept short: these are development builds, not releases.
      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: mlrc-${{ runner.os }}-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Native TLS headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $name = "mlrc-${{ github.ref_name }}-${{ matrix.target }}"
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          New-Item -ItemType Directory -Path $name | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/mlrc.exe" $name
          Copy-Item README.md $name
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          name="mlrc-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p dist "$name"
          cp "target/${{ matrix.target }}/release/mlrc" "$name"
          cp README.md "$name"
          tar -czf "dist/$name.tar.gz" "$name"

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: mlrc-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
